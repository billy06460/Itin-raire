name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer les dependances npm
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser le code web
        run: npx cap sync android

      - name: Autoriser l'execution de gradlew
        run: chmod +x android/gradlew

      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Mettre l'APK a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: itineraire-peages-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
