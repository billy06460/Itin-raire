name: Build Android APK

# Se declenche automatiquement a chaque envoi sur la branche "main",
# et peut aussi etre lance manuellement depuis l'onglet Actions de GitHub.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Le SDK Android est deja preinstalle sur les machines GitHub (ubuntu-latest),
      # avec les licences deja acceptees : pas besoin d'etape supplementaire ici.

      - name: Installer les dependances npm
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Generer l'icone (si resources/icon.png existe)
        run: |
          if [ -f "resources/icon.png" ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#14161a' --iconBackgroundColorDark '#14161a'
          else
            echo "Pas de resources/icon.png : icone par defaut de Capacitor conservee."
          fi

      - name: Ajouter les permissions (localisation, arriere-plan, service au premier plan)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$MANIFEST" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$MANIFEST"
          done
          for P in ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE_LOCATION; do
            grep -q "android.permission.$P\"" "$MANIFEST" || { echo "Permission $P non ajoutee"; exit 1; }
          done

      - name: Verrouiller l'orientation en mode portrait
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="portrait"' "$MANIFEST" || sed -i '/android:name=".MainActivity"/a\            android:screenOrientation="portrait"' "$MANIFEST"
          grep -q 'android:screenOrientation="portrait"' "$MANIFEST" || { echo "Verrouillage orientation non ajoute"; exit 1; }

      - name: Synchroniser le code web
        run: npx cap sync android

      - name: Autoriser l'execution de gradlew
        run: chmod +x android/gradlew

      # Toujours la MEME cle de signature (stockee dans les secrets GitHub) :
      # sans ca, l'empreinte SHA-1 changerait a chaque build, ce qui casserait
      # la restriction de la cle API Google configuree avec cette empreinte.
      - name: Preparer la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/itineraire.keystore" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 est incomplet ou mal copie. Recollez la longue ligne entiere du fichier secret."
            exit 1
          fi

      - name: Compiler l'APK (signee avec la cle fixe)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD manquant (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/itineraire.keystore" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::La cle ne s'ouvre pas : KEYSTORE_PASSWORD ou KEYSTORE_BASE64 mal copie."
            exit 1
          fi
          ./gradlew assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/itineraire.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=itinerairepeages \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Verifier le service GPS d'arriere-plan (information)
        run: |
          M=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*debug*" 2>/dev/null | head -1)
          echo "Manifeste fusionne : $M"
          if [ -n "$M" ] && grep -q "BackgroundGeolocationService" "$M"; then
            echo "OK : service GPS d'arriere-plan present dans l'APK."
          else
            echo "::warning::Service BackgroundGeolocationService introuvable dans le manifeste fusionne : le GPS en arriere-plan risque de ne pas fonctionner."
          fi

      - name: Mettre l'APK a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: itineraire-peages-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
